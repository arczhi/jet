[project]
name = "jet"
version = "0.1.0"
description = "A TypeSafe-native coding agent built on Recursive LLM Context Decomposition (RLCD)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "alex (arczhi)" }]
license = { text = "CC-BY-NC-4.0" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pywebview>=5.3",
    "rich>=13.8",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
jet = "jet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jet"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "BLE001"]
"src/jet/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/jet", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: spins up a real HTTP server (slower, still hermetic)",
]

[tool.coverage.run]
source = ["src/jet"]
omit = ["src/jet/ui/*"]
